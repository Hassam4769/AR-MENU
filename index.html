<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Menu Demo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    #startScreen img {
      max-width: 280px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: black;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- START SCREEN -->
  <div id="startScreen">
    <h2>AR Menu Preview</h2>
    <p>Point your camera at this image</p>
    <img src="burger.jpg" alt="Marker Image">
    <button onclick="startAR()">Start AR</button>
  </div>

  <!-- AR SCENE -->
  <a-scene
    mindar-image="imageTargetSrc: targets.mind; autoStart: false;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="visibility: hidden; width: 100vw; height: 100vh;"
  >

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- IMAGE TARGET -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-image
        src="burger.jpg"
        position="0 0 0"
        scale="1.2 1.2 1.2"
        rotation="0 0 0"
      >
        <a-animation
          attribute="rotation"
          to="0 360 0"
          dur="8000"
          repeat="indefinite">
        </a-animation>
      </a-image>

    </a-entity>

  </a-scene>

  <!-- SCRIPT -->
  <script>
    function startAR() {
      document.getElementById("startScreen").style.display = "none";

      const scene = document.querySelector("a-scene");
      scene.style.visibility = "visible";

      scene.components["mindar-image"].start();
    }
  </script>

</body>
</html>
